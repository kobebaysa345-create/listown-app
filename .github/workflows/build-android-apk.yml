name: Build LISTOWN Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.listown --project-name listown .
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="listown"/android:label="LISTOWN"/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: LISTOWN-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          archive: false
